<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team Photo Gallery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>⚽ TEAM PHOTO GALLERY</h1>
    <p>View and download your favourite team photos</p>
  </header>

  <main>

    <h2>Match Photos</h2>

    <div class="gallery">

      <!-- PHOTO 1 -->
      <div class="photo-card">
        <img src="photos/photo1.jpg" alt="Team photo">

        <h3>Team Photo</h3>

        <a class="download-button"
           href="photos/photo1.jpg"
           download="team-photo.jpg">
          Download Photo
        </a>
      </div>


      <!-- PHOTO 2 -->
      <div class="photo-card">
        <img src="photos/photo2.jpg" alt="Match photo">

        <h3>Match Day</h3>

        <a class="download-button"
           href="photos/photo2.jpg"
           download="match-day.jpg">
          Download Photo
        </a>
      </div>


      <!-- PHOTO 3 -->
      <div class="photo-card">
        <img src="photos/photo3.jpg" alt="Team celebration">

        <h3>Celebration</h3>

        <a class="download-button"
           href="photos/photo3.jpg"
           download="celebration.jpg">
          Download Photo
        </a>
      </div>

    </div>

  </main>


  <footer>
    <p>© 2026 Team Photo Gallery</p>
  </footer>

</body>
</html>
